<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surat Generator AI</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a2744;
      --navy-light: #243258;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #16a34a;
      --green-hover: #15803d;
      --red: #dc2626;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-500: #64748b;
      --gray-700: #334155;
      --gray-900: #0f172a;
      --white: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.07), 0 2px 4px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }

    header {
      background: var(--navy);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-md);
    }

    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    header h1 {
      color: var(--white);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header p {
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      margin-top: 1px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      background: var(--gray-50);
      padding: 14px 18px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .step-badge {
      background: var(--accent);
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-body {
      padding: 16px 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: 6px;
    }

    label span {
      color: var(--gray-500);
      font-weight: 400;
    }

    textarea, input[type="text"], input[type="date"] {
      width: 100%;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      font-family: inherit;
      color: var(--gray-900);
      background: var(--white);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus, input[type="date"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    textarea.mono {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .hint {
      font-size: 11px;
      color: var(--gray-500);
      margin-top: 5px;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-group:last-child { margin-bottom: 0; }

    .name-counter {
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
      float: right;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 15px;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-success {
      background: var(--green);
      color: white;
      font-size: 12px;
      padding: 7px 12px;
    }

    .btn-success:hover { background: var(--green-hover); }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 12px;
      padding: 7px 12px;
    }

    .btn-outline:hover { background: rgba(37,99,235,0.05); }

    .btn-zip {
      background: var(--navy);
      color: white;
      width: 100%;
      padding: 11px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .btn-zip:hover { background: var(--navy-light); }

    .generate-section {
      margin-top: 20px;
    }

    .progress-wrap {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: var(--shadow);
    }

    .progress-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 4px;
    }

    .progress-sub {
      font-size: 12px;
      color: var(--gray-500);
      margin-bottom: 14px;
    }

    .progress-bar-track {
      background: var(--gray-200);
      border-radius: 100px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--accent);
      height: 100%;
      border-radius: 100px;
      transition: width 0.4s ease;
    }

    .results-section {
      margin-top: 20px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .results-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-900);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-success {
      background: #dcfce7;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 100px;
    }

    .surat-item {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .surat-item-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--gray-200);
      background: var(--gray-50);
    }

    .surat-nama {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-900);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .surat-actions {
      display: flex;
      gap: 8px;
    }

    .surat-preview {
      padding: 14px 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .surat-preview pre {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      line-height: 1.6;
      color: var(--gray-700);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-top: 14px;
      display: flex;
      gap: 10px;
    }

    .error-icon { font-size: 16px; flex-shrink: 0; }

    .error-text { font-size: 13px; color: var(--red); line-height: 1.5; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--gray-500);
    }

    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.5; }

    .tip-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 12px 14px;
      margin-top: 14px;
    }

    .tip-box p {
      font-size: 12px;
      color: #1e40af;
      line-height: 1.5;
    }

    .tip-box strong { font-weight: 600; }

    .divider {
      height: 1px;
      background: var(--gray-200);
      margin: 20px 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    async function downloadDocx(nama, content) {
		const { Document, Paragraph, TextRun, Packer, AlignmentType } = window.docx;

		const lines = content.split('\n');
		const paragraphs = lines.map(line => {
			const trimmed = line.trimEnd();
			const isCenter = trimmed.toUpperCase() === trimmed && trimmed.length > 3 && trimmed.length < 40;
			return new Paragraph({
				alignment: isCenter ? AlignmentType.CENTER : AlignmentType.LEFT,
				children: [new TextRun({
					text: trimmed,
					font: 'Times New Roman',
					size: 24,
				})],
				spacing: { after: 0, before: 0, line: 276 },
			});
  });

  const doc = new Document({
    sections: [{
      properties: {
        page: {
          margin: { top: 1134, right: 1134, bottom: 1134, left: 1701 }
        }
      },
      children: paragraphs,
    }]
  });

  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Surat_${nama.replace(/\s+/g, '_')}.docx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    async function downloadAllZip(results) {
		const zip = new JSZip();
		for (const { nama, content } of results) {
			const { Document, Paragraph, TextRun, Packer, AlignmentType } = window.docx;
			const lines = content.split('\n');
			const paragraphs = lines.map(line => new Paragraph({
				children: [new TextRun({ text: line.trimEnd(), font: 'Times New Roman', size: 24 })],
				spacing: { after: 0, before: 0, line: 276 },
			}));
			const doc = new Document({ sections: [{ children: paragraphs }] });
			const blob = await Packer.toBlob(doc);
			const arrayBuffer = await blob.arrayBuffer();
			zip.file(`Surat_${nama.replace(/\s+/g, '_')}.docx`, arrayBuffer);
		}
		const blob = await zip.generateAsync({ type: 'blob' });
		saveAs(blob, 'Surat_Generator_Output.zip');
	}

    function App() {
      const [template, setTemplate] = useState('');
      const [names, setNames] = useState('');
      const [purpose, setPurpose] = useState('');
      const [date, setDate] = useState(new Date().toLocaleDateString('id-ID', {
        day: 'numeric', month: 'long', year: 'numeric'
      }));
      const [loading, setLoading] = useState(false);
      const [progress, setProgress] = useState({ current: 0, total: 0 });
      const [results, setResults] = useState([]);
      const [errors, setErrors] = useState([]);
      const [globalError, setGlobalError] = useState('');
      const abortRef = useRef(false);

      const nameList = names.split('\n').map(n => n.trim()).filter(Boolean);
      const nameCount = nameList.length;

      async function handleGenerate() {
        setGlobalError('');
        setErrors([]);

        if (!template.trim()) return setGlobalError('Template surat harus diisi');
        if (nameCount === 0) return setGlobalError('Masukkan minimal 1 nama');
        if (nameCount > 20) return setGlobalError('Maksimal 20 nama sekaligus');
        if (!purpose.trim()) return setGlobalError('Tujuan/Hal harus diisi');
        if (!date.trim()) return setGlobalError('Tanggal harus diisi');

        setLoading(true);
        setResults([]);
        setProgress({ current: 0, total: nameCount });
        abortRef.current = false;

        const newResults = [];
        const newErrors = [];

        for (let i = 0; i < nameList.length; i++) {
          if (abortRef.current) break;

          const nama = nameList[i];
          setProgress({ current: i + 1, total: nameList.length });

          try {
            const res = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ template, nama, purpose, date }),
            });

            const data = await res.json();

            if (!res.ok) throw new Error(data.error || 'Gagal generate');

            newResults.push({ nama: data.nama, content: data.content });
            setResults([...newResults]);
          } catch (err) {
            newErrors.push({ nama, error: err.message });
            setErrors([...newErrors]);
          }
        }

        setLoading(false);
      }

      function handleStop() {
        abortRef.current = true;
        setLoading(false);
      }

      const progressPct = progress.total > 0
        ? Math.round((progress.current / progress.total) * 100)
        : 0;

      return (
        <div>
          <header>
            <div className="header-icon">📄</div>
            <div>
              <h1>Surat Generator AI</h1>
              <p>Generate surat dinas otomatis — format persis template lo</p>
            </div>
          </header>

          <div className="container">
            <div className="layout">
              {/* LEFT: Template */}
              <div className="card">
                <div className="card-header">
                  <div className="step-badge">1</div>
                  <h2>Template Surat</h2>
                </div>
                <div className="card-body">
                  <div className="field-group">
                    <label>Paste template surat referensi lo di sini</label>
                    <textarea
                      className="mono"
                      rows={18}
                      placeholder={"Contoh:\n\nPEMERINTAH KOTA BATAM\nDINAS KETENAGAKERJAAN\nJl. Engku Putri No. 1 Batam\n\nNomor: 520/DSN/IV/2026/001\nLampiran: -\nHal: Undangan Rapat\n\nYth. [NAMA PENERIMA]\ndi Tempat\n\nDengan hormat,\n..."}
                      value={template}
                      onChange={e => setTemplate(e.target.value)}
                    />
                    <p className="hint">Format, kop surat, dan tanda tangan akan dipertahankan persis</p>
                  </div>

                  <div className="tip-box">
                    <p><strong>💡 Tips:</strong> Semakin lengkap template, semakin akurat output-nya. Paste full surat termasuk kop, nomor, isi, dan blok tanda tangan.</p>
                  </div>
                </div>
              </div>

              {/* RIGHT: Inputs */}
              <div>
                <div className="card">
                  <div className="card-header">
                    <div className="step-badge">2</div>
                    <h2>Detail Surat</h2>
                  </div>
                  <div className="card-body">
                    <div className="field-group">
                      <label>
                        Daftar Nama <span>— satu nama per baris</span>
                        <span className="name-counter">{nameCount} nama</span>
                      </label>
                      <textarea
                        rows={7}
                        placeholder={"Ahmad Fauzi\nSiti Rahayu\nBudi Santoso\nDewi Lestari"}
                        value={names}
                        onChange={e => setNames(e.target.value)}
                      />
                      <p className="hint">Maks. 20 nama sekaligus</p>
                    </div>

                    <div className="field-group">
                      <label>Perihal / Tujuan Surat</label>
                      <input
                        type="text"
                        placeholder="Cth: Undangan Sosialisasi Program Pelatihan Kerja"
                        value={purpose}
                        onChange={e => setPurpose(e.target.value)}
                      />
                    </div>

                    <div className="field-group">
                      <label>Tanggal Surat</label>
                      <input
                        type="text"
                        placeholder="Cth: 27 April 2026"
                        value={date}
                        onChange={e => setDate(e.target.value)}
                      />
                    </div>
                  </div>
                </div>

                {/* Generate Button */}
                <div className="generate-section">
                  {!loading ? (
                    <button className="btn btn-primary" onClick={handleGenerate}>
                      ⚡ Generate {nameCount > 0 ? `${nameCount} Surat` : 'Surat'}
                    </button>
                  ) : (
                    <button className="btn btn-primary" style={{background: '#dc2626'}} onClick={handleStop}>
                      ⛔ Stop Generate
                    </button>
                  )}

                  {globalError && (
                    <div className="error-box" style={{marginTop: 12}}>
                      <span className="error-icon">⚠️</span>
                      <span className="error-text">{globalError}</span>
                    </div>
                  )}
                </div>

                {/* Progress */}
                {loading && (
                  <div className="progress-wrap" style={{marginTop: 16}}>
                    <p className="progress-title">
                      <span className="spinner" style={{display:'inline-block', border:'2px solid #e2e8f0', borderTopColor: '#2563eb', width:14, height:14, borderRadius:'50%', animation:'spin 0.7s linear infinite', verticalAlign:'middle', marginRight:8}}></span>
                      Generating surat {progress.current} dari {progress.total}...
                    </p>
                    <p className="progress-sub">Sabar ya, AI lagi kerja 🤖</p>
                    <div className="progress-bar-track">
                      <div className="progress-bar-fill" style={{width: `${progressPct}%`}}></div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Results */}
            {(results.length > 0 || errors.length > 0) && (
              <div className="results-section">
                <div className="divider"></div>
                <div className="results-header">
                  <h2 className="results-title">
                    ✅ Hasil Generate
                    <span className="badge-success">{results.length} surat</span>
                  </h2>
                </div>

                {results.length > 1 && (
                  <button
                    className="btn btn-zip"
                    onClick={() => downloadAllZip(results)}
                  >
                    📦 Download Semua ({results.length} file) sebagai ZIP
                  </button>
                )}

                {errors.length > 0 && errors.map(({ nama, error }) => (
                  <div className="error-box" style={{marginBottom:10}} key={nama}>
                    <span className="error-icon">❌</span>
                    <span className="error-text"><strong>{nama}:</strong> {error}</span>
                  </div>
                ))}

                {results.map(({ nama, content }) => (
                  <div className="surat-item" key={nama}>
                    <div className="surat-item-header">
                      <span className="surat-nama">
                        👤 {nama}
                      </span>
                      <div className="surat-actions">
                        <button
                          className="btn btn-outline"
                          onClick={() => {navigator.clipboard.writeText(content)}}
                          title="Copy ke clipboard"
                        >
                          📋 Copy
                        </button>
                        <button
                          className="btn btn-success"
                          onClick={() => downloadDocx(nama, content)}
                        >
                          ⬇ Download .docx
                        </button>
                      </div>
                    </div>
                    <div className="surat-preview">
                      <pre>{content}</pre>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {results.length === 0 && !loading && (
              <div className="empty-state">
                <div className="icon">📋</div>
                <p>Paste template → isi nama & detail → klik Generate<br/>Output siap dalam hitungan detik per surat</p>
              </div>
            )}
          </div>

          <footer>
            Surat Generator AI — graha-tion aesen ai · Powered by Claude AI
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
